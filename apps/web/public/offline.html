<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a5f" />
    <title>Tidak ada koneksi</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; background: #fff; color: #172741; text-align: center; padding: 24px; }
      main { max-width: 22rem; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.25rem; line-height: 1.55; color: #475569; }
      button { font: inherit; font-weight: 600; background: #1e3a5f; color: #fff; border: 0; border-radius: 10px; padding: .75rem 1.25rem; min-height: 44px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tidak ada koneksi internet</h1>
      <p>Portal butuh internet untuk menampilkan data terbaru. Periksa sinyal atau Wi-Fi Anda, lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
