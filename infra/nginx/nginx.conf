# Optional reverse proxy in front of the app container.
#
# Security headers (ADR-0044, EP-08): the Go app sets X-Content-Type-Options,
# X-Frame-Options, Referrer-Policy, Permissions-Policy, the
# Content-Security-Policy (built from its own S3 config) and, outside
# APP_ENV=development, Strict-Transport-Security on every response. nginx
# passes them through unchanged; do not add_header the same names here, or
# browsers receive two copies (two CSPs are both enforced, the stricter wins).
# Put server_tokens off in the http {} block of the host's nginx.conf too.
server {
  listen 80;
  server_tokens off;

  location / {
    proxy_pass http://app:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
